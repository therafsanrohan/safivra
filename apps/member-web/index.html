<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://o*.ingest.sentry.io; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#234C3A" />
    <meta name="description" content="Safivra — Personal financial management for Bangladesh" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      window.addEventListener('vite:preloadError', (event) => {
        const lastReload = sessionStorage.getItem('safivra_last_preload_reload');
        const now = Date.now();
        if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
          sessionStorage.setItem('safivra_last_preload_reload', now.toString());
          console.warn('Preload error detected, reloading page to load latest bundle:', event);
          window.location.reload();
        }
      });
    </script>
    <title>Safivra — Personal Financial Management</title>
  </head>
  <body>
    <noscript>
      <div style="padding:24px; text-align:center; font-family:system-ui,sans-serif;">
        <h2>JavaScript Required</h2>
        <p>Safivra requires JavaScript to be enabled to manage your personal finances securely.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
