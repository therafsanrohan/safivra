<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#234C3A" />
    <meta name="description" content="Safivra — Personal financial management for Bangladesh" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      window.addEventListener('vite:preloadError', (event) => {
        const lastReload = sessionStorage.getItem('safivra_last_preload_reload');
        const now = Date.now();
        if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
          sessionStorage.setItem('safivra_last_preload_reload', now.toString());
          console.warn('Preload error detected, reloading page to load latest bundle:', event);
          window.location.reload();
        }
      });
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML += '<div style="color:red; z-index:9999; position:absolute; top:0; left:0; background:white; padding:20px;">' + msg + '<br>' + (error && error.stack) + '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; z-index:9999; position:absolute; top:50px; left:0; background:white; padding:20px;">' + event.reason + '</div>';
      });
    </script>
    <title>Safivra — Personal Financial Management</title>
  </head>
  <body>
    <noscript>
      <div style="padding:24px; text-align:center; font-family:system-ui,sans-serif;">
        <h2>JavaScript Required</h2>
        <p>Safivra requires JavaScript to be enabled to manage your personal finances securely.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
